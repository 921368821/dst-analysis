<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>引擎内核 · 编辑器（最小闭环）</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #0b0e13; color: #c9d1d9;
    font: 12px/1.5 ui-monospace, Consolas, "Courier New", monospace; }
  #grid { display: grid; height: 100vh;
    grid-template-columns: 240px 1fr 260px;
    grid-template-rows: 34px 1fr 78px 40px;
    grid-template-areas: "top top top" "tree view props" "doc doc doc" "pie pie pie"; }
  #top { grid-area: top; display: flex; align-items: center; gap: 12px;
    padding: 0 10px; background: #10151d; border-bottom: 1px solid #1d2530; }
  #top b { color: #e6c07b; font-weight: 600; }
  #top .dim { color: #6a7684; }
  /* 左列 = 工程场景（上）+ 场景树（中）+ 资产（下）。
     「工程场景」与「场景树」是两个不同的轴：前者是**文档**（工程里有几份世界），
     后者是**当前那份世界里的节点**。它们挤在同一列，所以各自的标题必须写清楚，
     否则"点一行换世界"和"点一行选节点"看起来是同一件事。 */
  #left { grid-area: tree; display: grid; grid-template-rows: auto 1fr auto;
    min-height: 0; background: #0d1219; border-right: 1px solid #1d2530; }
  #tree { overflow: auto; padding: 6px 4px; min-height: 0; }
  #view { grid-area: view; position: relative; overflow: hidden; background: #0b0e13; }
  #cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  /* 工程场景列表：最多几行、自己滚。行样式与场景树刻意不同（圆角块 + 当前项加粗），
     免得人以为那是"另一种节点"。 */
  #scenes { max-height: 30%; overflow: auto; padding: 4px 4px 6px;
    border-bottom: 1px solid #1d2530; }
  #scenes h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px;
    padding: 0 2px; font-size: 11px; color: #6a7684; font-weight: 600; }
  #scenes h2 .grow { flex: 1 1 auto; }
  #scenes button { font-size: 10px; padding: 1px 6px; line-height: 15px; }
  .srow { padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: #9fb4d0; }
  .srow:hover { background: rgba(255,255,255,.06); }
  .srow.sel { background: rgba(226,192,123,.2); outline: 1px solid rgba(230,192,123,.55);
    color: #e6c07b; font-weight: 600; }

  #props { grid-area: props; overflow: auto; padding: 8px 10px;
    background: #0d1219; border-left: 1px solid #1d2530; }
  #pie { grid-area: pie; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; background: #10151d; border-top: 1px solid #1d2530; }

  /* 文档区：导出/打开的文本框。单独一行而不是塞进工具栏 —— 场景 JSON 有几百行，
     挤在 40px 的条里既看不清也没法选中一段复制。 */
  #doc { grid-area: doc; display: flex; gap: 8px; padding: 6px 10px;
    background: #0d1219; border-top: 1px solid #1d2530; }
  #doc .col { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  #doc textarea { flex: 1 1 auto; min-width: 0; resize: none;
    background: #0a0e14; color: #e6edf3; border: 1px solid #263140; border-radius: 3px;
    padding: 3px 6px; font: inherit; white-space: pre; overflow: auto; }
  #doc .dim { color: #6a7684; }

  .row { padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: rgba(255,255,255,.06); }
  .row.sel { background: rgba(88,140,220,.28); outline: 1px solid rgba(120,170,255,.5); }
  .row .id { color: #4d5866; }
  .row.dead { color: #6a7684; text-decoration: line-through; }

  /* 资产面板：底部固定高度、自己滚。标题行放条数与「加入场景」按钮 ——
     按钮在标题上而不是每行尾部，是因为一行里塞两个可点区域会让"拖行"和"点按钮"
     混在一起（场景树那边刚被这个问题咬过）。 */
  #assets { max-height: 42%; overflow: auto; padding: 4px 4px 6px;
    border-top: 1px solid #1d2530; }
  #assets h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px;
    padding: 0 2px; font-size: 11px; color: #6a7684; font-weight: 600; }
  #assets h2 .grow { flex: 1 1 auto; }
  #assets button { font-size: 10px; padding: 1px 6px; line-height: 15px; }
  .arow { display: flex; align-items: center; gap: 6px; padding: 1px 6px;
    border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .arow:hover { background: rgba(255,255,255,.06); }
  .arow.sel { background: rgba(88,140,220,.28); outline: 1px solid rgba(120,170,255,.5); }
  .arow .k { flex: 0 0 auto; font-size: 10px; color: #4d5866; }
  .arow .p { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  /* 无帧 = 点「加入场景」也画不出来。做成可见的弱化色，而不是点了才报错。 */
  .arow .nof { flex: 0 0 auto; font-size: 10px; color: #c98a5a; }
  .arow.noframe .p { color: #6a7684; }
  #assets .empty { color: #6a7684; padding: 0 4px; }
  /* 拖到画布：无帧的资产不允许拖（cursor 就说明白了，不用等松手才报错）。 */
  .arow.noframe { cursor: default; }
  .arow:not(.noframe) { cursor: grab; }
  /* 画布高亮：拖动中指针在画布上时亮一圈 —— 否则人只能试一次才知道能不能放。 */
  #cv.drop { outline: 2px dashed rgba(120,170,255,.75); outline-offset: -3px; }
  /* 拖放换父：源行淡出、落点行高亮。两者都只在拖动期间存在（pointerup 一定清掉）。 */
  .row.dragging { opacity: .45; }
  .row.drop { background: rgba(120,200,140,.22); outline: 1px solid rgba(120,220,150,.65); }

  /* 决策树面板（批157）：盖在画布上，因为它比右侧那 260px 宽得多（一行要放 id/kind/op
     ＋两个按钮），而且它编辑的东西**不在世界里** —— 挤进属性面板会让人以为它是某个
     节点的属性。盖层而不是新开一列：列一多，画布就只剩中间一条。 */
  #treeditor { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    background: rgba(11,14,19,.97); border-radius: 2px; }
  #treeditor[hidden] { display: none; }
  .te-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid #1d2530; background: #10151d; }
  .te-head b { color: #e6c07b; font-weight: 600; }
  .te-head .grow { flex: 1 1 auto; }
  .te-head button { font-size: 10px; padding: 1px 8px; line-height: 16px; }
  .te-hint { padding: 4px 10px; font-size: 11px; border-bottom: 1px solid #1d2530;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .te-hint.ok { color: #6fbf8f; }
  .te-hint.warn { color: #d8b26a; background: rgba(216,178,106,.08); }
  .te-hint.bad { color: #e06c60; background: rgba(224,108,96,.10); }
  #te-body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #te-rows { flex: 1 1 auto; overflow: auto; padding: 4px 6px; min-height: 0; }
  /* 一行 = 一个节点。缩进说明层级；颜色说明状态（红=装不上 / 黄=提醒）。 */
  .te-row { display: flex; align-items: center; gap: 8px; padding: 1px 6px;
    border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .te-row:hover { background: rgba(255,255,255,.06); }
  .te-row.sel { background: rgba(88,140,220,.28); outline: 1px solid rgba(120,170,255,.5); }
  .te-row.bad .tid { color: #ff8f83; }
  .te-row.warn .tid { color: #e0b979; }
  .te-row .tid { color: #cfd8e3; }
  .te-row .tk { color: #6a7684; font-size: 10px; }
  .te-row .td { color: #8fb6e0; font-size: 10px; }
  .te-row .tc { color: #4d5866; font-size: 10px; }
  .te-row.dragging { opacity: .45; }
  .te-row.drop { background: rgba(120,200,140,.22); outline: 1px solid rgba(120,220,150,.65); }
  .te-mini { font-size: 10px; padding: 0 5px; line-height: 14px; margin-left: 2px; }
  #te-form { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 10px; border-top: 1px solid #1d2530; background: #10151d; }
  #te-form label { color: #6a7684; font-size: 10px; }
  #te-form input, #te-form select { font: inherit; font-size: 11px;
    background: #0a0e14; color: #e6edf3; border: 1px solid #263140; border-radius: 3px;
    padding: 1px 4px; }
  #te-form input#te-id { width: 120px; }
  #te-form input#te-ticks { width: 56px; }
  #te-form button { font-size: 10px; padding: 1px 8px; line-height: 16px; }

  #props h2 { margin: 0 0 6px; font-size: 12px; color: #8b98a8; font-weight: 600; }
  #props h3 { margin: 12px 0 4px; font-size: 11px; color: #6a7684; font-weight: 600;
    border-bottom: 1px solid #1d2530; padding-bottom: 3px; display: flex;
    align-items: center; justify-content: space-between; gap: 6px; }
  #props .empty { color: #6a7684; }
  /* 挂组件那一行 / 每个组件标题右侧的「卸下」：同一套小按钮口径，
     免得「卸下」比「挂上」大一圈，看起来像是另一种操作。 */
  .comp-add { display: flex; gap: 6px; align-items: center; margin: 2px 0 6px; }
  .comp-add select { flex: 1 1 auto; min-width: 0; font-size: 11px; }
  .comp-add button, .comp-off { font-size: 10px; padding: 1px 6px; line-height: 15px; }
  .f { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .f label { flex: 0 0 74px; color: #9fb4d0; overflow: hidden; text-overflow: ellipsis; }
  .f input[type=text], .f input[type=number] { flex: 1 1 auto; min-width: 0;
    background: #0a0e14; color: #e6edf3; border: 1px solid #263140; border-radius: 3px;
    padding: 2px 5px; font: inherit; }
  .f input.bad { border-color: #b3564f; outline: 1px solid rgba(200,90,80,.45); }
  .f .ty { color: #4d5866; font-size: 10px; }

  button { background: #1b2431; color: #c9d1d9; border: 1px solid #2a3340;
    border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #23303f; }
  button.on { background: rgba(88,140,220,.35); border-color: rgba(120,170,255,.6); color: #fff; }
  button:disabled { opacity: .38; cursor: default; }
  button:disabled:hover { background: #1b2431; }
  #pie { white-space: nowrap; overflow: hidden; }
  #pie .sep { width: 1px; height: 16px; background: #2a3340; margin: 0 2px; flex: 0 0 auto; }
  #hist { color: #7f8fa4; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  #err { color: #e06c60; }
  #tick { color: #9fb4d0; }
</style>
</head>
<body>
<div id="grid">
  <div id="top">
    <b>编辑器</b>
    <span class="dim" id="status">启动中…</span>
    <span id="err"></span>
  </div>
  <div id="left">
    <div id="scenes">
      <h2><span>工程场景</span><span class="dim" id="scenecount">—</span><span class="dim" id="savenote">未存盘</span>
        <span class="grow"></span>
        <button id="scene-new" title="新建一个空场景并切过去（当前场景会先被保存）">新建</button>
        <button id="scene-del" title="删掉当前场景">删除</button></h2>
      <div id="scenelist"><div class="empty">—</div></div>
    </div>
    <div id="tree"></div>
    <div id="assets">
      <h2><span>资产</span><span class="dim" id="assetcount">—</span>
        <span class="grow"></span>
        <button id="asset-add" disabled>加入场景</button></h2>
      <div id="assetlist"><div class="empty">读取清单…</div></div>
    </div>
  </div>
  <div id="view"><canvas id="cv"></canvas>
    <!-- 决策树面板（批157）。默认隐藏；点资产面板里的一份 .tree.json 才出来。 -->
    <div id="treeditor" hidden>
      <div class="te-head">
        <b id="te-title">树</b>
        <span class="dim" id="te-note">—</span>
        <span class="grow"></span>
        <button id="te-undo" title="撤销一次树编辑">撤销</button>
        <button id="te-redo" title="重做一次树编辑">重做</button>
        <button id="te-export" title="导出成 .tree.json（可以放进 web/assets/ai/）">导出 .tree.json</button>
        <button id="te-reset" title="丢掉本地改动，回到文件里的那一份">还原成文件</button>
        <button id="te-close">关闭</button>
      </div>
      <div id="te-hint" class="te-hint ok">—</div>
      <div id="te-body">
        <div id="te-rows"></div>
        <div id="te-form">
          <label for="te-id">id</label><input id="te-id" type="text" spellcheck="false">
          <label for="te-kind">kind</label><select id="te-kind"></select>
          <label for="te-op">op</label><select id="te-op"></select>
          <label for="te-ticks">ticks</label><input id="te-ticks" type="text">
          <button id="te-apply">应用</button>
          <button id="te-child">加子节点</button>
          <button id="te-del">删除</button>
        </div>
      </div>
    </div>
  </div>
  <div id="props"><div class="empty">未选中</div></div>
  <div id="doc">
    <div class="col">
      <button id="btn-save">保存到文本</button>
      <button id="btn-open">从文本打开</button>
    </div>
    <textarea id="doctext" spellcheck="false" placeholder="场景 JSON：点「保存到文本」导出；改完（或粘贴一份存档）点「从文本打开」"></textarea>
    <div class="col">
      <button id="btn-new" title="把当前场景清空成一个空文档（工程里的场景列表不变；想要多一份场景用左上角的「新建」）">清空当前场景</button>
      <span class="dim" id="docinfo">—</span>
    </div>
  </div>
  <div id="pie">
    <button id="btn-play">播放</button>
    <button id="btn-pause">暂停</button>
    <button id="btn-stop" title="结束试玩：试玩期间被世界改掉的东西会全部回滚">停止</button>
    <button id="btn-step">单步</button>
    <button id="btn-step10">单步×10</button>
    <button id="btn-psave" title="把这一局存下来（当前在哪一关 + 走过的每一关长什么样）。与工程存档分开：那一个存设计，这个存进度">存档进度</button>
    <button id="btn-pload" title="读回上次存的进度（只在试玩中可用；会把世界换成存档里那一份）">读档进度</button>
    <span class="sep"></span>
    <button id="btn-add">新建节点</button>
    <button id="btn-del">删除选中</button>
    <button id="btn-undo">撤销</button>
    <button id="btn-redo">重做</button>
    <span id="hist"></span>
    <span class="dim" id="pieinfo"></span>
    <span class="dim" id="pienote"></span>
    <span id="tick">tick 0</span>
  </div>
</div>
<script type="module" src="./editor.js"></script>
</body>
</html>
