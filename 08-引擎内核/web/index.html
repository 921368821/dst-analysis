<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>引擎内核 · 2.5D 演示</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #0b0e13; color: #c9d1d9;
    font: 12px/1.5 ui-monospace, Consolas, "Courier New", monospace; }
  #cv { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px;
    background: rgba(8,11,16,.72); border-bottom-right-radius: 6px;
    white-space: nowrap; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 16px; background: rgba(28,38,52,.92);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); opacity: 0; transition: opacity .18s;
    pointer-events: none; white-space: nowrap; }
  #help { position: fixed; right: 8px; bottom: 8px; opacity: .45; font-size: 11px;
    text-align: right; pointer-events: none; }
  /* 背包面板的样式在批71 搬进了引擎：它现在是 UI 节点（九宫格皮肤 + 位图字体），
     不再是 DOM。这里删掉的 .row-item / .empty / .foot 一套 CSS 若留着，
     "面板长什么样"就会有两处定义 —— 改一处另一处悄悄失效。 */
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">启动中…</div>
<div id="toast"></div>
<div id="help">键位由映射表生成（启动后写入）</div>
<!--
  背包面板**没有 DOM**：它是引擎 UI 树里的一块（`host/hud-ui.ts`），
  所以这里既没有 #bag，也没有 #bag-rows。
  `#hud` 留着只是为了"UI 资产缺失时退回一行文本"这条降级路径 —— UI 起来之后它会被隐藏。
-->
<script type="module" src="./bundle.js"></script>
</body>
</html>
