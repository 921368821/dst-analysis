<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>引擎内核 · 2.5D 演示</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #0b0e13; color: #c9d1d9;
    font: 12px/1.5 ui-monospace, Consolas, "Courier New", monospace; }
  #cv { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px;
    background: rgba(8,11,16,.72); border-bottom-right-radius: 6px;
    white-space: nowrap; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 16px; background: rgba(28,38,52,.92);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); opacity: 0; transition: opacity .18s;
    pointer-events: none; white-space: nowrap; }
  #help { position: fixed; right: 8px; bottom: 8px; opacity: .45; font-size: 11px;
    text-align: right; pointer-events: none; }
  /* 背包面板：与 HUD 不同，它要能吃鼠标事件（点选堆叠） */
  #bag { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    min-width: 220px; padding: 10px 12px; border-radius: 8px;
    background: rgba(10,14,20,.94); border: 1px solid #2a3340;
    box-shadow: 0 8px 32px rgba(0,0,0,.5); pointer-events: auto; }
  #bag[hidden] { display: none; }
  #bag h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: #8b98a8; }
  #bag .row-item { display: flex; justify-content: space-between; gap: 12px;
    padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  #bag .row-item:hover { background: rgba(255,255,255,.06); }
  #bag .row-item.sel { background: rgba(88,140,220,.28); outline: 1px solid rgba(120,170,255,.5); }
  #bag .row-item .k { color: #9fb4d0; }
  #bag .row-item .n { color: #e6c07b; }
  #bag .empty { color: #6a7684; padding: 4px 6px; }
  #bag .foot { margin-top: 8px; padding-top: 6px; border-top: 1px solid #222a35;
    font-size: 11px; color: #6a7684; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">启动中…</div>
<div id="toast"></div>
<div id="help">键位由映射表生成（启动后写入）</div>
<div id="bag" hidden>
  <h2>背包</h2>
  <div id="bag-rows"></div>
  <div class="foot" id="bag-foot"></div>
</div>
<script type="module" src="./bundle.js"></script>
</body>
</html>
