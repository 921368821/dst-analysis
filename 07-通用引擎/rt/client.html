<!DOCTYPE html>
<!--[[=========================================================================
 client.html —— 浏览器客户端（P1 首版：先证明「能看、能动」）

 本版故意**不做**图集精灵（那是 P4）：
   先用色块 + 标签把「世界在实时走、键盘真的在操控角色」这件事**看得见**。
   一次做太大反而容易既不好看也不正确。

 与服务器的关系（见 ../开发计划.md §1.1）：
   服务端权威推进 30 Hz → 每帧发快照 → 本页只负责**画**与**收输入**
   页面**不跑模拟**，所以不会出现「两端算得不一样」。
============================================================================]]-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实时引擎 · P1 骨架（色块版）</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;
            font:13px/1.5 ui-monospace,Consolas,monospace;overflow:hidden;
            /* ★ P23：手机上必须关掉浏览器的默认手势（滚动/双击缩放/长按菜单），
               否则「按住摇杆拖动」会被解释成滚动页面并把 pointercancel 打过来。 */
            touch-action:none;-webkit-user-select:none;user-select:none;
            -webkit-tap-highlight-color:transparent}
  #cv{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:10px;top:10px;background:rgba(13,17,23,.82);
       border:1px solid #30363d;border-radius:6px;padding:8px 11px;white-space:pre}
  #hud b{color:#58a6ff}
  .warn{color:#f0883e}
  .ok{color:#3fb950}
  #help{position:fixed;left:10px;bottom:10px;background:rgba(13,17,23,.82);
        border:1px solid #30363d;border-radius:6px;padding:8px 11px}
  kbd{background:#21262d;border:1px solid #30363d;border-radius:3px;padding:0 4px}

  /* ★★ P62：编辑器面板（对照 Unity 的「层级 / 视口 / 属性」三栏）
     布局原则：#ed 是**穿透层**（pointer-events:none），只有它里面的面板接收鼠标，
     这样打开编辑器时**中间的地图仍然可点可拖** —— 否则每一块空白都会吃掉一次点击。
     面板统一半透明深色，和 HUD 一致：不做成不透明大白框，因为编辑时最需要看见地图。 */
  #edBtn{position:fixed;right:10px;top:10px;z-index:30;cursor:pointer;
         background:rgba(13,17,23,.9);border:1px solid #30363d;border-radius:6px;
         padding:5px 12px;font-size:12px;color:#c9d1d9}
  #edBtn:hover{background:#21262d}
  #edBtn.on{border-color:#58a6ff;color:#58a6ff}
  #ed{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;
      font:12px/1.5 ui-monospace,Consolas,monospace}
  #ed.on{display:block}
  #ed>*{pointer-events:auto}
  #edBar{position:absolute;left:50%;transform:translateX(-50%);top:8px;
         display:flex;gap:6px;align-items:center;white-space:nowrap;
         background:rgba(13,17,23,.94);border:1px solid #30363d;border-radius:8px;
         padding:6px 10px;max-width:calc(100vw - 20px);overflow-x:auto}
  #edBar button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;
                border-radius:5px;padding:4px 9px;cursor:pointer;font:inherit}
  #edBar button:hover{background:#30363d}
  #edBar button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
  #edBar button.danger{border-color:#f85149;color:#f85149}
  #edBar .sep{width:1px;height:18px;background:#30363d;flex:0 0 auto}
  #edBar label{display:flex;align-items:center;gap:4px;color:#8b949e;cursor:pointer}
  #edBar select{background:#0d1117;border:1px solid #30363d;border-radius:4px;
                color:#c9d1d9;padding:3px 4px;font:inherit;max-width:120px}
  #edStatus{color:#8b949e;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  #edTree{position:absolute;left:8px;top:56px;bottom:8px;width:248px;
          display:flex;flex-direction:column;overflow:hidden;
          background:rgba(13,17,23,.94);border:1px solid #30363d;border-radius:8px}
  #edTreeHead{padding:6px 8px;border-bottom:1px solid #30363d;flex:0 0 auto}
  #edSearch{width:100%;box-sizing:border-box;background:#0d1117;border:1px solid #30363d;
            border-radius:4px;color:#c9d1d9;padding:4px 6px;font:inherit}
  #edCount{color:#6e7681;margin-top:4px;font-size:11px}
  #edList{overflow-y:auto;flex:1 1 auto}
  .edRow{display:flex;gap:6px;padding:3px 8px;cursor:pointer;
         border-bottom:1px solid #161b22;white-space:nowrap}
  .edRow:hover{background:#161b22}
  .edRow.sel{background:rgba(31,111,235,.22);box-shadow:inset 2px 0 0 #58a6ff}
  .edRow .g{color:#6e7681;min-width:38px}
  .edRow .p{color:#c9d1d9;flex:1;overflow:hidden;text-overflow:ellipsis}
  .edRow .c{color:#6e7681}
  #edProps{position:absolute;right:8px;top:56px;width:248px;padding:10px;
           background:rgba(13,17,23,.94);border:1px solid #30363d;border-radius:8px}
  #edProps h4{margin:0 0 8px;font-size:12px;color:#58a6ff;font-weight:600}
  .edField{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .edField label{color:#8b949e;min-width:44px}
  .edField input{flex:1;min-width:0;background:#0d1117;border:1px solid #30363d;
                 border-radius:4px;color:#c9d1d9;padding:3px 6px;font:inherit}
  .edField input[readonly]{color:#8b949e;border-style:dashed}
  .edBtns{display:flex;gap:6px;margin-top:10px}
  .edBtns button{flex:1;background:#21262d;color:#c9d1d9;border:1px solid #30363d;
                 border-radius:5px;padding:5px 3px;cursor:pointer;font:inherit}
  .edBtns button:hover{background:#30363d}
  .edBtns button.danger{border-color:#f85149;color:#f85149}
  .edBtns button.danger:hover{background:rgba(248,81,73,.14)}
  /* ★ C4：场景文本框（默认收起） */
  #edSceneBox{display:none;padding:6px 8px;border-bottom:1px solid #23262d}
  #edSceneBox.on{display:block}
  #edSceneRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  #edSceneName{flex:0 0 200px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;
    border-radius:4px;padding:3px 6px;font:11px ui-monospace,Consolas,monospace}
  #edSceneText{width:100%;height:120px;box-sizing:border-box;resize:vertical;
    background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;
    font:11px/1.5 ui-monospace,Consolas,monospace;padding:6px;white-space:pre;overflow:auto}
  .edMuted{color:#6e7681}
  .edHint{color:#6e7681;font-size:11px;margin-top:8px;line-height:1.6}

  /* ── 合成面板（B2）。放在右下：编辑器占左（层级）与右（属性），
        合成是「玩」的功能不是「编」的功能，视觉上要和编辑器分开。 ── */
  #craftBtn{position:fixed;top:8px;right:76px;z-index:30;padding:4px 10px;
            background:rgba(13,17,23,.9);border:1px solid #30363d;border-radius:6px;
            color:#c9d1d9;font-size:12px;cursor:pointer;user-select:none}
  #craftBtn:hover{background:#21262d}
  #craftBtn.on{border-color:#3fb950;color:#3fb950}
  #craft{position:fixed;right:8px;bottom:8px;width:320px;max-height:62vh;z-index:30;
         display:none;flex-direction:column;overflow:hidden;
         background:rgba(13,17,23,.96);border:1px solid #30363d;border-radius:8px}
  #craft.on{display:flex}
  #craftHead{display:flex;align-items:center;gap:8px;padding:7px 10px;
             border-bottom:1px solid #30363d;flex:0 0 auto;font-size:12px;color:#58a6ff}
  #craftHead b{font-weight:600}
  #craftStat{color:#6e7681;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #craftClose{cursor:pointer;color:#8b949e;padding:0 4px}
  #craftClose:hover{color:#f85149}
  #craftList{overflow-y:auto;flex:1 1 auto;min-height:60px}
  .crRow{display:flex;gap:8px;align-items:baseline;padding:5px 10px;cursor:pointer;
         border-bottom:1px solid #161b22}
  .crRow:hover{background:#161b22}
  .crRow .p{color:#c9d1d9;flex:0 0 108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crRow .i{color:#8b949e;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 「不能造」不是隐藏，是**置灰 + 保留在列表里**：玩家需要知道「还差什么」才有目标。
     藏起来的话，面板上永远只有能造的东西，等于没有进度感。 */
  .crRow.no{opacity:.45}
  .crRow.no .p{color:#8b949e}
  .crRow.yes .p::before{content:"● ";color:#3fb950}
  .crRow.no  .p::before{content:"○ ";color:#6e7681}
  #craftMsg{padding:6px 10px;border-top:1px solid #30363d;flex:0 0 auto;
            font-size:11px;color:#8b949e;line-height:1.5;word-break:break-word}
  #craftMsg.bad{color:#f85149}
  #craftMsg.good{color:#3fb950}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">连接中…</div>
<div id="help"></div>
<!-- ★★ P62：编辑器（F1 或点右上角开关）。结构对照 Unity：工具栏 / 层级 / 视口 / 属性。 -->
<div id="edBtn" title="切换编辑器（F1）">编辑器</div>
<div id="ed">
  <div id="edBar">
    <button data-tool="select" class="on">选择</button>
    <button data-tool="move">移动</button>
    <button data-tool="spawn">生成</button>
    <select id="edPrefab" title="「生成」工具要放的 prefab"></select>
    <span class="sep"></span>
    <!-- ★ M1-1：撤销/重做。放在工具栏而不是快捷键里就完事：快捷键是给熟手的，
         而"这个编辑器能不能撤销"是**新用户第一眼要确认的事**（不能撤销就不敢动大东西）。 -->
    <button id="edUndo" title="撤销（Ctrl+Z）">↶</button>
    <button id="edRedo" title="重做（Ctrl+Shift+Z）">↷</button>
    <span class="sep"></span>
    <button id="edSave">存档</button>
    <!-- ★ C4：场景（关卡）导出/导入/清空。与「存档」的区别写在按钮 tooltip 里 ——
         这是**用户最容易混的一对概念**：按"存档"再按"导出场景"得到的不是同一样东西。 -->
    <button id="edSceneOut" title="导出为场景文本（只含摆了什么，不含玩家/背包/时间）">场景↓</button>
    <button id="edSceneIn" title="把文本框里的场景导入（先清空世界，再按文本生成）">场景↑</button>
    <button id="edSceneClear" class="danger" title="清空世界里所有非玩家实体（玩家与附属实体保留）">清空</button>
    <button id="edFocus">聚焦</button>
    <button id="edDel" class="danger">删除</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="edHideAnon">隐藏无名</label>
    <span id="edStatus">按 F1 退出编辑器</span>
  </div>
  <!-- ★ C4：场景文本框。**默认收起**：编辑器右下角已经有树和预览，再常驻一个多行框
       会把可视区挤到只剩一条。导出时自动展开 —— 用户按了"场景↓"就是要看内容。 -->
  <div id="edSceneBox" class="off">
    <!-- ★ C3：落盘。有了这一行，"保存场景"才不是"请你手动复制文本"。 -->
    <div id="edSceneRow">
      <input id="edSceneName" placeholder="场景名（字母/数字/下划线/中文）" maxlength="64">
      <button id="edSceneSave" title="把当前世界存成 scenes/&lt;名字&gt;.scene.tsv">存盘</button>
      <button id="edSceneLoad" title="读盘 → 清空世界 → 导入（失败时世界已清空）">读取</button>
      <span id="edSceneList" class="edMuted"></span>
    </div>
    <textarea id="edSceneText" spellcheck="false"
      placeholder="prefab&#9;x&#9;z   ← 一行一个实体（制表符分隔）"></textarea>
    <div class="edHint">导入会先清空世界里的非玩家实体；坏行会让**整份**被拒（不会摆一半）。</div>
  </div>
  <div id="edTree">
    <div id="edTreeHead">
      <input id="edSearch" placeholder="过滤 prefab…">
      <div id="edCount">—</div>
    </div>
    <div id="edList"></div>
  </div>
  <div id="edProps">
    <h4>属性</h4>
    <div id="edPropsBody"><span class="edMuted">未选中对象</span></div>
    <div class="edHint">点击地图对象即可选中；拖动地图是平移相机，不会被误当成点选。</div>
  </div>
</div>
<!-- ★★ B2：合成面板。为什么挂在游戏里而不是编辑器里：合成是**玩法**，
     不是编辑行为 —— 玩家即使不打开编辑器也要能造东西。
     与编辑器的编辑器通道共用门槛（`/editor/craft` 只接受回环），
     因为这台机器上的浏览器本身就是回环。 -->
<div id="craftBtn" title="合成（F2）">合成</div>
<div id="craft">
  <div id="craftHead">
    <b>合成</b><span id="craftStat">—</span><span id="craftClose" title="关闭">×</span>
  </div>
  <div id="craftList"></div>
  <div id="craftMsg">按 F2 关闭 · 点击置灰的配方可以看到缺什么</div>
</div>
<script src="audio.js"></script>
<script src="render_atlas.js"></script>
<script src="render_batch.js"></script>
<!-- ★ L1：协议常量单源（由 protocol.schema.json 生成）—— 必须排在 protocol_bin.js 之前 -->
<script src="protocol_schema.js"></script>
<script src="protocol_bin.js"></script>
<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// ★★ P4：真实图集精灵渲染器（rt/render_atlas.js）
//   画不出来时（图集还没加载 / 缺符号 / 缺帧）会返回 false，
//   调用方**回退画圆** —— 所以画面永远有东西，不会白屏。
// ★ 防御：万一 render_atlas.js 没加载上（脚本 404 / 被拦），
//   也不能让整个客户端崩掉 —— 降级成「只画圆」，功能少一半但页面还活着。
const Atlas = (typeof RenderAtlas !== 'undefined')
  ? new RenderAtlas.AtlasRenderer('/atlas', ctx) : null;
const hud = document.getElementById('hud');

// ---------------------------------------------------------------- 音频（H1）
// ★ 浏览器的硬规则：AudioContext 在**用户手势**之前是 suspended，resume() 也必须在
//   手势的同步调用栈里。所以这里只**挂一次**监听，真正的 resume 交给第一个手势。
//   没有这一步的话，代码全对但永远没声音 —— 那是本工程最讨厌的形态（静默无效）。
if (typeof AudioEngine !== 'undefined') {
  try { AudioEngine.hookUnlock(); } catch (e) { /* 无音频环境：静默降级，不拖垮页面 */ }
}

// ---------------------------------------------------------------- 批渲染（C2）
// ★★ 为什么要有它：Canvas 2D 路径里**每个符号**都要付一次
//   save → translate → scale → transform → drawImage → restore。
//   400 个实体 × 3~8 个符号 = 1200~3200 次 drawImage —— 这就是「大场景帧率上限」。
//   批路径把这些符号摊成四边形，同纹理的合成**一次 drawArrays**。
//   （实测：185 个符号 → 12 次 draw call，省 93.5%；见 tests/test_render_batch.js）
//
// ⚠️ 为什么是「离屏 GL 画布 + 一次 drawImage 贴回」，而不是再叠一层 DOM canvas：
//   2D 画布上还有地形（在精灵**下面**）、夜色/交互圈/摇杆（在精灵**上面**）。
//   分两层 DOM canvas 就得把「精灵夹在中间」这件事交给 CSS 层叠顺序表达 ——
//   而层叠顺序**没有判据**（只能靠看）。用一次 drawImage 贴回，层次仍由
//   代码顺序决定，与改动前是同一处。
//
// 模式（`?render=canvas|batch|auto`）：
//   auto（默认）—— 有 WebGL 就用批路径；初始化失败自动回落 Canvas 并**说明原因**；
//   canvas       —— 强制旧路径（对照/排障）；
//   batch        —— 强制批路径（不可用时照实说，不偷偷回落）。
const RENDER = (() => {
  const m = /[?&]render=(auto|canvas|batch)\b/.exec((typeof location !== 'undefined' && location.search) || '');
  return m ? m[1] : 'auto';
})();

const SPR = (() => {
  const st = { on: false, mode: 'canvas', why: '', quads: 0, draws: 0, frames: 0,
               textures: 0, glErrors: 0, missingTextures: 0, pushes: 0 };
  let gl = null, glc = null, rd = null;
  let quads = [], emitStats = {};
  const tex = new Map();                       // "build|atlas" -> WebGLTexture

  function fail(why) {
    st.on = false; st.mode = 'canvas';
    // ★ `?render=batch` 是**明确要求**批路径：这时降级必须说清楚"是你要的没做到"，
    //   而不是和 auto 模式一样淡淡地说一句"回落了"。两种情形混在一起的话，
    //   「我明明强制开了」和「浏览器不支持」就永远分不清。
    st.why = why + (RENDER === 'batch'
      ? '（?render=batch 强制 batch，但没有降级余地）' : '');
    st.glErrors++; gl = null; rd = null;
    // ★ 不许静默降级：页面控制台 + `__rt.render()` 都要能看到**为什么**没开。
    try { console.log('[render] 批路径不可用，回落 Canvas 2D —— ' + st.why); } catch (e) { /* ignore */ }
  }

  function init() {
    if (RENDER === 'canvas') { st.why = '?render=canvas 指定走 Canvas'; return; }
    if (typeof RenderBatch === 'undefined') { st.why = 'render_batch.js 没加载'; return; }
    try {
      glc = document.createElement('canvas');
      glc.width = cv.width; glc.height = cv.height;
      // ★ 必须 alpha:true —— 精灵层要透明，否则贴回时会整块盖掉地形。
      const opt = { alpha: true, premultipliedAlpha: false, antialias: false };
      gl = glc.getContext('webgl', opt) || glc.getContext('experimental-webgl', opt);
      if (!gl) { fail('浏览器没给 WebGL 上下文'); return; }
      rd = new RenderBatch.WebGLAtlasRenderer(gl);   // ★ 编译/链接失败会抛，见下
      st.on = true; st.mode = 'batch'; st.why = 'ok';
      try { console.log('[render] 批渲染已启用（' + st.mode + '）'); } catch (e) { /* ignore */ }
    } catch (e) {
      fail('WebGL 初始化失败: ' + (e && e.message ? e.message : e));
    }
  }

  /** 图集图片 → GL 纹理（同一 key 只上传一次） */
  function upload(key, img) {
    if (!gl || !img || !img.complete || !img.naturalWidth) return null;
    let t = tex.get(key);
    if (t) return t;
    t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    // ★ 图集是**像素画**：必须 NEAREST。线性过滤会把它糊成一团 ——
    //   与 Canvas 侧 `imageSmoothingEnabled = false` 是同一个决定。
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    tex.set(key, t); st.textures = tex.size;
    return t;
  }

  return {
    init,
    get on() { return st.on; },
    get mode() { return st.mode; },
    stats: () => Object.assign({}, st),
    begin() { if (st.on) { quads = []; emitStats = {}; } },
    /**
     * 把一个实体摊成四边形（不画）。返回真的摊出的个数：
     * 0 ⇒ 调用方应当回退画圆（与 Canvas 路径 `drawEntity` 返回 false 同一语义）。
     */
    push(ent, sx, sy, scale) {
      if (!st.on || !Atlas) return 0;
      Atlas.ensure(ent.bld);                       // 触发加载，不等待（首帧可能全是圆）
      const rec = Atlas.builds[ent.bld];
      if (!rec) return 0;

    flush(ctx2d) {

        }

SPR.init();

// ---------------------------------------------------------------- 相机
const cam = { x: 0, z: 0, zoom: 8, follow: true };

// ---------------------------------------------------------------- 交互（P22）
// ★★ 目标由**服务端**给（它才知道「这东西能不能砍/挖/捡」），客户端只做三件事：
//   ① 每 0.5 s 拉一次目标列表；② 挑最近的那个高亮 + 在 HUD 上写「按空格 砍」；
//   ③ 按空格 → 发 `{cmd:"act",v:guid}`，松开发 unact。
//   ⚠️ 为什么不在客户端算距离/可交互：那是**规则复制**，两边迟早不一致
//     （本工程在「动画名」「地形名」上各栽过一次）。
//
// ★★★ 2026-10-16：**「按住时每 0.7 s 重发一次」已删**（这是简化，也顺带更省）。
//   实测（把玩家钉成不死，各跑 3 遍，量「砍倒一棵 15 点的树」）：
//     · 客户端每 0.7 s 重发 + 服务端 1 s 节拍 ⇒ **21 s / 共 30 次 push**（每 push 0.5 点）
//     · 只让服务端按 1 s 节拍（客户端只发一次）⇒ **15 s / 共 15 次 push**（每 push 1 点）
//   两遍各 3 次连跑结果**完全一致**。
//   为什么重发会浪费：每次 `{cmd:"act"}` 都会把服务端的「下一拍」**重置为立刻**
//     （`PENDING.next_t = 0`）⇒ 两个节拍**叠加**，多出来的那些 push 是在上一记还没落地时打的。
//   ⚠️ 这里原来写的是「重发会打断引擎自己的动作循环」——**那个说法是错的**（见 §9y.3），
//     连砍本来就是靠服务端的定时重发撑起来的。真正的理由是**节拍只该有一个主人**。
//   ⇒ 现在：**按下只发一次**，剩下的交给服务端；想再来一次（如挖树桩）就**再按一次**。
//     `ACT.held` 只用来在 HUD 上显示「进行中」，不再驱动任何重发。
const ACT = { targets: [], pick: null, pickId: null, lastMsg: '', lastOk: null, lastAt: 0,
              held: false, nextAt: 0, sent: 0, polling: false };
// ★★ 选中（2026-10-16 加）：以前**永远只能作用于最近的那个**。
//   默认世界里玩家周围有十几棵东西 ⇒ 「想砍哪棵就砍哪棵」是最基本的操作，
//   而在此之前办不到（按空格永远是最近的）。
//   做法：按下的位置**命中某个目标**（屏幕距离够近）⇒ 选中它；
//   否则保持原状（并交给相机拖动）。选择按 **guid** 保持 ——
//   目标列表每 0.5 s 刷一次，按**下标**保持会在列表变化时指到别的东西上。
function pickTargetAt(sx, sy) {
  let best = null, bestD = null;
  const R = Math.max(16, cam.zoom * 1.3);      // 屏幕像素：缩放大 ⇒ 目标也大 ⇒ 命中半径跟着放大
  for (const t of ACT.targets) {
    const [tx, ty] = w2s(t.x, t.z);
    const d = Math.hypot(tx - sx, ty - sy);
    if (d <= R && (bestD === null || d < bestD)) { best = t; bestD = d; }
  }
  return best;
}

  if (ws && ws.readyState === 1 && !ACT.polling) {
    ACT.polling = true;
    sendCmd({ cmd: 'targets' });
    // ★ P39：同一次节拍顺手要一次「我怎么了」。**不按帧发** —— 血/饿是秒级的量，
    //   30 Hz 地推等于把带宽花在看不出变化的小数位上（也违背「拉取而非推送」的既定做法）。
    sendCmd({ cmd: 'me' });
    ME_ST.asked++;
    setTimeout(() => { ACT.polling = false; }, 500);      // 0.5 s 一次，别把链路刷满
  }

  //   它不见了（被砍倒/走远了）才退回最近的那个（服务端已按距离升序 ⇒ 第一个最近）。
  if (ACT.pickId !== null) {
    ACT.pick = ACT.targets.find((t) => t.id === ACT.pickId) || null;
    if (!ACT.pick) ACT.pickId = null;                     // 目标没了 ⇒ 明确放弃选择
  }
  if (!ACT.pick) ACT.pick = ACT.targets.length ? ACT.targets[0] : null;
  // ★ 这里**故意**什么都不做：按住 ≠ 重发（见上方实测：节拍只该有一个主人）。
  //   留着这个函数是因为它还要负责「每 0.5 s 拉一次目标」与「挑最近的那个」。
}

  if (ACT.held) return;
  ACT.held = true;

    sendCmd({ cmd: 'act', v: ACT.pick.id }); ACT.sent++;

    //   声音在这里是**信息**：砍和捡的声音不同，用户不看屏幕也知道自己在干什么。
    //   ⚠️ 这是**预测性**播放（不等服务端确认就响）—— 游戏音效的常规做法：
    //     等 100 ms 的往返再响，手感和声音就对不上了。
    if (typeof AudioEngine !== 'undefined') {
      const a = String(ACT.pick.a || '').toUpperCase();
      AudioEngine.play(a === 'ATTACK' ? 'act.hit'

  if (!ACT.held) return;
  ACT.held = false;
  sendCmd({ cmd: 'unact' });

// ---------------------------------------------------------------- 会话身份（P21）
// ★ 为什么需要：没有它，刷新页面 = 丢掉自己的角色（重连拿一个新 wilson，站在原地的是个空壳）。
//   做法：本地存一个随机 key（localStorage），随连接带上；服务端记 key→角色，
//   断线后有**宽限期**保留角色 ⇒ 重连拿回同一个 guid、同一个位置。
//   ⚠️ localStorage 在 file:// 或隐私模式下可能抛异常 ⇒ 必须 try/catch，
//      拿不到就退化成「每次都是新角色」（功能少一点，但页面不能因此崩）。
//   ⚠️ **必须声明在 `connect()` 之前**：`const` 有 TDZ，位置错了直接
//      "Cannot access 'SKEY' before initialization"（同一个坑在 Lua 的 `local` 上也踩过）。
const SKEY = (function () {
  try {
    let k = localStorage.getItem('rt_key');
    if (!k) {
      k = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('rt_key', k);
    }
    return k;
  } catch (e) {
    return '';
  }
})();

// ---------------------------------------------------------------- 连接
let ws = null, lastFrame = null, prevFrame = null, frameAt = 0, prevAt = 0;

    // ★★ P20：连上就**问一次「我是谁」**（拉取，见 server.py 的说明）。
    //   玩家是在模拟线程里异步建的 ⇒ 服务端可能先回 `null`，所以这里**退避重试**。

// ---------------------------------------------------------------- 往返延迟（计划 2.4）

// ---------------------------------------------------------------- 客户端预测（P5 5.4）
// ★ 为什么要有它：服务端 30 Hz + 网络往返 ⇒ 玩家按键到画面反应之间会有「一次往返」的延迟。
//   预测 = **本地立刻按自己的输入推进玩家的位置**，服务端的帧到了再校正。
//   这是「输入延迟」与「权威一致性」这一对矛盾的标准解法。
//
// ★★ 三条必须做对（都是网络游戏里踩烂了的坑）：
//   ① **误差小 ⇒ 平滑收敛，误差大 ⇒ 立刻吸附**。不分级的话，
//      要么小误差永远不收敛（画面与真实位置越来越远），

//   ② **没有输入就不能外推**。否则网络一卡，人物会自己往前滑。
//   ③ **速度要测出来，不要硬编码**。引擎的走/跑速度会随地形/倍率变化，

const PRED = { ok: false, x: 0, z: 0, vx: 0, vz: 0,

let lastPlayerScreen = null;

const CORRECT_RATE = 0.25; // 每帧最多修正 25% 的误差（平滑收敛）

  const pp = prev ? myEnt(prev) : null;
  if (pp && f.t > prev.t) {
    const d = Math.hypot(p.x - pp.x, p.z - pp.z);
    const dt = f.t - prev.t;

  const e = Math.hypot(PRED.x - p.x, PRED.z - p.z);
  PRED.err = e;
  if (e > SNAP_EPS) {
    // ② 大误差：**吸附**，不插值 —— 传送/复活/被推走都属于这一类

function predStep(dt) {
  if (!PRED.ok) return;
  const p = myEnt(lastFrame);
  if (!p) return;
  // ③ 没有输入 ⇒ 不外推（否则卡顿时人物自己往前滑）
  const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const dz = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  if (dx || dz) {
    if (moveSpeed > 0) {
      const inv = (dx && dz) ? Math.SQRT1_2 : 1;      // 斜向归一化，与引擎一致
      PRED.x += dx * inv * moveSpeed * dt;
      PRED.z += dz * inv * moveSpeed * dt;

    } else {
      PRED.noSpeed++;                                  // 还没测到速度 ⇒ 这帧不外推（如实记数）
    }

// ---------------------------------------------------------------- 绘制预算（P4 4.4）
// ★ 为什么要有计数器：掉帧保护与降级是**看不见的行为**（画面只是「差一点」），
//   没有计数就等于「改没改都一样」。而且 Node 沙箱里图集永远加载不出来

function drawNight() {
  const w = lastFrame && lastFrame.world;

// ---------------------------------------------------------------- 触屏面板（P23）
// ★ 画在**最后**（夜里也要看得见），且只在 PAD.on 时画。
//   摇杆帽的位置直接由**当前方向键状态**反推 —— 画的就是真的生效的东西，
//   不是另存一份「摇杆位置」的状态（那样又变成两处实现）。

// 帮助文字随输入方式切换（手机上写 WASD 是没用的）

    ? '左下 <b>摇杆</b>移动 · 右下 <b>动作</b>键 · <b>点目标</b>选中要砍的那棵 · 单指拖拽平移 · 双指捏合缩放'
    : '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键移动 · ' +

  //   为什么不丢实体本身：位置是信息，标签是装饰 —— 只会丢后者。
  const behind = lastDrawAt > 0 && (now - lastDrawAt) > 40;

  ctx.strokeStyle = '#161b22'; ctx.lineWidth = 1;

  const pending = [];

    const old = new Map(prevFrame.ents.map(e => [e.id, e]));

      //     · 不是玩家（玩家永远最高优先级：找不到自己比画质差更糟）；
      //     · 离相机中心 > NEAR_R 世界单位；
      //     · 当前缩放 < DEGRADE_ZOOM ⇒ 精灵在屏幕上只有几像素高，
      //       画它等于白花一次 drawImage（400 实体 × 低缩放时这笔开销很实在）。
      //   降级后画一个 2×2 的点 —— **位置信息一点都不丢**，丢的只是「看不清的纹理」。
      const far = Math.abs(x - cam.x) > NEAR_R || Math.abs(z - cam.z) > NEAR_R;
      const lowPrio = !isPlayer && far && cam.zoom < DEGRADE_ZOOM;
      if (lowPrio) {
        PERF.dots++;
        ctx.fillStyle = '#6e7681';
        ctx.fillRect(sx - 1, sy - 1, 2, 2);
        continue;
      }
      PERF.sprites++;

      // ★ P4：先试**真图集精灵**；画不出来（图集未就绪/缺符号/缺帧）就回退画圆。
      //   `ensure` 只是触发加载，不等待 —— 首帧可能全是圆，几帧后就都有精灵了。
      //
      // ★★ C2：批路径下这里**只摊四边形，不画**。真正的绘制被延到循环外一次
      //   `SPR.flush()`（同纹理合成一次 drawArrays）。所以精灵、圆、标记三者
      //   不能在这里按原顺序混着画了 —— 改成：
      //     ① 本循环：只决定"该画什么"（精灵暂存 / 圆和注解进 pending）
      //     ② flush：一次画完所有精灵并贴回 2D 画布
      //     ③ 第二遍：补画圆（无精灵的实体）、玩家标记、名字标签
      //   ⚠️ 代价说清楚：第二遍的"圆"会盖在精灵**上面**（原来是按实体顺序交错）。
      //     实测这个差异只在「图集还没加载完」的瞬间存在 —— 稳定态下 fallback = 0
      //     （见 tests/test_client_batch.js 的判据），此时不存在任何交错。
      let drewSprite = false;
      if (SPR.on && e.bld) {
        drewSprite = SPR.push(e, sx, sy, cam.zoom) > 0;
        if (drewSprite) PERF.drew++;
      } else if (Atlas && e.bld) {
        Atlas.ensure(e.bld);
        drewSprite = Atlas.drawEntity(e, sx, sy, cam.zoom);
        if (drewSprite) PERF.drew++;
      }
      if (!drewSprite) PERF.fallback++;
      pending.push({ sx, sy, isPlayer, drew: drewSprite, ent: e, behind });
    }

    // ② 精灵：批路径一次画完；Canvas 路径此时已经画完了（上面那个分支）
    if (SPR.on) SPR.flush(ctx);

    // ③ 注解：圆（无精灵）/ 玩家标记 / 名字标签
    for (const p of pending) {
      const { sx, sy, isPlayer } = p;
      if (!p.drew) {
        ctx.fillStyle = isPlayer ? '#3fb950' : '#8b949e';
        ctx.beginPath();
        ctx.arc(sx, sy, isPlayer ? r * 1.6 : r, 0, 6.2832);
        ctx.fill();
      }
      // 玩家标记：无论精灵还是圆，都要看得见「哪个是我」
      if (isPlayer) {
        lastPlayerScreen = [sx, sy];
        ctx.strokeStyle = '#d2f5c8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, r * 2.1, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = '#d2f5c8';
        ctx.fillText(p.ent.p || 'player', sx + r * 2.6, sy - r * 2.2);
      } else if (cam.zoom >= 12 && p.ent.p && !p.behind) {
        // ★【帧合并/掉帧保护】落后时**先丢装饰**（标签是纯装饰，位置才是信息）。
        PERF.labels++;
        ctx.fillStyle = '#6e7681';
        ctx.fillText(p.ent.p, sx + r * 1.6, sy - r * 1.4);
      }
    }
  }

  // 交互目标（P22 + P28）：**所有**目标都画一个淡淡的圈（否则用户不知道哪些能点），
  //   选中的那个画粗圈 + 名称 + 动作名。
  //   ★ 不画出来的后果是真实的：目标列表是服务端给的，用户看不见它就等于没有「选择」。
  const RING = Math.max(10, cam.zoom * 0.9);
  for (const t of ACT.targets) {
    if (ACT.pick && t.id === ACT.pick.id) continue;        // 选中的那个下面单独画
    const [tx, ty] = w2s(t.x, t.z);
    if (tx < -30 || ty < -30 || tx > cv.width + 30 || ty > cv.height + 30) continue;
    ctx.strokeStyle = 'rgba(88,166,255,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(tx, ty, RING * 0.8, 0, 6.2832); ctx.stroke();
  }
  if (ACT.pick) {
    const [tx, ty] = w2s(ACT.pick.x, ACT.pick.z);
    ctx.strokeStyle = ACT.held ? '#ffd866' : '#58a6ff';
    ctx.lineWidth = ACT.pickId !== null ? 3 : 2;           // 手动选中的更粗
    ctx.beginPath(); ctx.arc(tx, ty, RING, 0, 6.2832); ctx.stroke();
    const lab = `${ACT.pick.p} · ${ACT.pick.a}` + (ACT.pickId !== null ? '（已选）' : '');
    ctx.fillStyle = '#8b949e';
    ctx.fillText(lab, tx + Math.max(12, cam.zoom), ty - Math.max(12, cam.zoom));
  }

  // 昼夜明暗（画在实体**之上**、HUD 十字之下）
  drawNight();

  // 触屏面板（再往上一层：夜里也得看得见、按得到）
  drawPad();

  // 视野中心十字
  ctx.strokeStyle = '#30363d';
  ctx.beginPath();
  ctx.moveTo(cv.width/2 - 7, cv.height/2); ctx.lineTo(cv.width/2 + 7, cv.height/2);
  ctx.moveTo(cv.width/2, cv.height/2 - 7); ctx.lineTo(cv.width/2, cv.height/2 + 7);
  ctx.stroke();

  // ★ P62：选中框画在**最上层**（系统球）—— 它要能盖住夜色遮罩和摇杆，
  //   否则「选中了哪个」在夜里或手机上就看不见了。
  edDrawOverlay();

  requestAnimationFrame(loop);
}

function loop(now) {
  frames++;
  if (now - fpsAt >= 500) { fps = frames * 1000 / (now - fpsAt); frames = 0; fpsAt = now; }
  if (now - bytesAt >= 1000) { bps = bytesIn; bytesIn = 0; bytesAt = now; }
  draw(now);

  // HUD
  const f = lastFrame;
  const missing = selfMissingCheck(now);      // ★ 找不到自己（多半是在复活，见该函数说明）
  const PHASE_CN = { day: '白天', dusk: '黄昏', night: '夜晚' };
  const SEASON_CN = { autumn: '秋', winter: '冬', spring: '春', summer: '夏' };
  const st = !f ? '等待首帧…'
    : `t=<b>${f.t.toFixed(2)}</b>s  tick=<b>${f.tick}</b>  实体=<b>${f.n}</b>`
      // ★ H5：被上限吃掉多少，必须在 HUD 上看得见。否则「世界只有 400 个」与
      //   「世界有 456 但只送了 400」在屏幕上一模一样 —— 后者会让所有规模判断失真。
      + (f.truncated ? ` <span class="warn">(+${f.dropped} 未送 / 共 ${f.total})</span>` : '')
      + (f.world
          ? `  ${PHASE_CN[f.world.phase] || f.world.phase || '?'}`
            + `·${SEASON_CN[f.world.season] || f.world.season || '?'}`
            + `·<b>${f.world.temperature.toFixed(0)}°</b>`
          : '  <span class="warn">(无世界环境)</span>');
  hud.innerHTML =
    (connected ? '<span class="ok">● 已连接</span>'
               : (everConnected ? '<span class="warn">● 已断开，重连中…</span>'
                                : '<span class="warn">● 连接中…</span>')) +
    (paused ? '  <span style="color:#d29922">⏸ 已暂停（P 继续）</span>'
            : '  <span style="color:#8b949e">P 暂停</span>') +
    `  fps=<b>${fps.toFixed(0)}</b>  带宽=<b>${(bps/1024).toFixed(1)}</b>KB/s\n` +
    st + `\n输入序号=<b>${f ? f.iseq : '-'}</b>  缩放=${cam.zoom.toFixed(1)}` +
    `  跟随=<b>${cam.follow ? '开' : '关'}</b>` +
    `  地形=<b>${TERR.ready ? TERR.w + '×' + TERR.h : '网格'}</b>` +
    `  精灵/点=<b>${PERF.sprites}/${PERF.dots}</b>` +
    `  预测误差=<b>${PRED.err.toFixed(2)}</b>${PRED.snapped ? `  <span class="warn">吸附×${PRED.snapped}</span>` : ''}` +
    `  延迟=<b>${RTT.ms ? RTT.ms.toFixed(0) + ' ms' : '—'}</b>` +
    `  我=<b>#${ME.id === undefined ? '?' : ME.id}</b>${ME.slot ? `(槽${ME.slot})` : ''}` +
    (BUSY ? '  <span class="warn">⚠ 同一个浏览器会话已在别处打开</span>' : '') +
    (missing ? '  <span class="warn">⚠ 找不到自己（可能正在复活…）</span>' : '') +
    `\n${meLine(ME_ST)}` +
    `  目标=<b>${ACT.pick ? ACT.pick.p + '·' + ACT.pick.a : '无'}</b>` +
    `  <span style="color:#8b949e">空格${ACT.held ? '（进行中）' : ''}</span>` +
    (PAD.on ? `  触屏=<b>开</b>${PAD.active ? `(${PAD.active}指)` : ''}` : '') +
    (ACT.lastMsg ? `  <span style="color:${ACT.lastOk ? '#3fb950' : '#f85149'}">${ACT.lastOk ? '' : '✘ '}${ACT.lastMsg}</span>` : '') +
    (TERR.failed ? `  <span class="warn">地形加载失败 ${TERR.failed} 次</span>` : '');
}
// ============================================================================
// ★★ P62：编辑器
//
// 为什么要有它：在此之前这个客户端**只有一张地图 + 一行 HUD**。
//   能走、能砍、能捡，但「世界里有谁、它在哪、能不能改」全靠 `/healthz` 和命令行。
//   这不是「游戏界面缺失」，是**缺少观察与操作世界的入口** —— 对照 Unity 编辑器，
//   缺的是四件最基础的事：对象层级、属性面板、工具栏、视口里的选中与编辑。
//
// 本版只做**最小可用**那一层，刻意不做：撤销栈、多选、复制粘贴、变换手柄。
//   理由：先让「看得见 → 选得中 → 改得动 → 存得下」闭环，再谈好用。
//
// 与服务器的约定：全部走 `/editor/*`（见 http_api.py 的 `_editor_allowed`）——
//   门槛是**请求来自回环**，不需要 `--allow-debug`。
//   ⇒ 若页面是从别的机器访问的，这些按钮会返回 403。这是设计如此，不是 bug。
// ============================================================================
const ED = {
  on: false,
  tool: 'select',          // select | move | spawn
  sel: null,               // 选中的实体对象（{guid, prefab, x, z, hp}）
  ents: [],                // 最近一次拉到的全量实体
  count: 0,                // 世界真实总数（可能 > ents.length）
  listed: 0,
  hideAnon: false,         // 是否隐藏 prefab 为 "?" 的实体（原点死重量很多）
  q: '',
  busy: false,
  timer: null,
  spawnPrefab: 'sapling',
};

function edSetStatus(msg, bad) {
  const el = document.getElementById('edStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = bad ? '#f85149' : '#8b949e';
  el.title = msg;
}
// ★★★ C3：**先刷新、再写状态**——把它做成一个函数，而不是每次手写顺序。
//   同一个坑在这一条会话里出现了**三次**：
//     ① B7 撤销按钮（F34 抓到：状态栏一闪就被「已同步：世界 N 个实体」覆盖）
//     ② B14 场景导入（F37 抓到：同样的覆盖）
//     ③ C3 场景读取失败（F38 抓到：连"已清空 14 个"都被覆盖掉）
//   三次都是"写状态 → 刷新"，而 `edRefresh()` 里会写它自己的状态。
//   ⇒ 只要还允许手写顺序，就会有第四次。所以这里收成一个入口：
//       edSetStatusAfterRefresh(msg, bad)
//   它先等刷新完成，再写状态。**不许**再在别处写「先 set 后 refresh」。
function edSetStatusAfterRefresh(msg, bad) {
  return Promise.resolve(edRefresh()).then(() => edSetStatus(msg, bad),
                                           () => edSetStatus(msg, bad));
}
function edEsc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function edJson(path, opts) {
  // cache:no-store 是必须的：这些接口每次都返回**当下**的事实，
  // 浏览器缓存会让「删了还在列表里」变成一次幽灵故障。
  //
  // ★ C3c：支持 POST（`opts.body` 会被 JSON 序列化）。目前只有"导入场景"用 ——
  //   因为整份场景文本塞进 URL query 会在上百实体时撞长度上限，
  //   而那种报错（414/400）与"场景里有坏行"分不清。
  const init = { cache: 'no-store' };
  if (opts && opts.body !== undefined) {
    init.method = 'POST';
    init.headers = { 'Content-Type': 'application/json' };
    init.body = JSON.stringify(opts.body);
  }
  return fetch(path, init).then((r) => r.json());
}

// ---------------------------------------------------------------- 拉取与列表
function edRefresh() {
  // ★ M1-1：**返回 promise**。撤销/重做要在刷新**之后**再写状态栏，
  //   否则调用方先写"已撤销"，紧接着刷新把状态栏覆盖成"已同步：世界 N 个实体" ——
  //   用户按了撤销却什么都看不到（F34 首跑实测就是这个）。
  if (!ED.on || ED.busy) return Promise.resolve();
  ED.busy = true;
  return edJson('/editor/entities?limit=800').then((d) => {
    ED.busy = false;
    if (!d.ok) { edSetStatus('读取失败：' + (d.error || '未知'), true); return; }
    ED.ents = d.items || [];
    ED.count = d.count || 0;
    ED.listed = d.listed || 0;
    edFillPrefabs();
    // 选中项跟着刷新（位置可能已经变了）；对象消失就**明确取消选中**，
    // 不保留一个指向空气的属性面板。
    if (ED.sel) {
      const cur = ED.ents.find((e) => e.guid === ED.sel.guid);
      if (cur) { ED.sel = Object.assign({}, ED.sel, cur); }
      else { ED.sel = null; }
      edRenderProps();
    }
    edRenderList();
    edSetStatus('已同步：世界 ' + ED.count + ' 个实体');
  }).catch((e) => {
    ED.busy = false;
    edSetStatus('读取出错：' + e.message, true);
  });
}
function edFillPrefabs() {
  const sel = document.getElementById('edPrefab');
  if (!sel) return;
  // 候选来自两处：世界**真实存在**的 prefab（最不会拼错），加一批常用项打底。
  // 只给一份硬编码清单的话，刷出来的名字和实际 prefab 名对不上就会「生成失败」。
  const base = ['sapling', 'evergreen', 'tree', 'rock1', 'rock2', 'flint', 'twigs',
                'grass', 'berrybush', 'carrot', 'log', 'cutgrass', 'spider', 'rabbit',
                'pigman', 'campfire', 'firepit', 'torch', 'axe', 'pickaxe'];
  const names = new Set(base);
  for (const e of ED.ents) if (e.prefab && e.prefab !== '?') names.add(e.prefab);
  const cur = sel.value || ED.spawnPrefab;
  const arr = [...names].sort();
  sel.innerHTML = arr.map((n) => '<option>' + edEsc(n) + '</option>').join('');
  if (names.has(cur)) sel.value = cur;
  ED.spawnPrefab = sel.value;
}
function edVisible() {
  const q = ED.q.trim().toLowerCase();
  return ED.ents.filter((e) => {
    if (ED.hideAnon && (!e.prefab || e.prefab === '?')) return false;
    if (q && (e.prefab || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function edRenderList() {
  const list = document.getElementById('edList');
  if (!list) return;
  const arr = edVisible();
  const fmt = (v) => (v == null ? '-' : Math.round(v));
  // 拼字符串而不是逐条 createElement：实体数以百计，后者会明显更慢。
  list.innerHTML = arr.length
    ? arr.map((e) =>
        '<div class="edRow' + (ED.sel && ED.sel.guid === e.guid ? ' sel' : '') +
        '" data-g="' + e.guid + '">' +
        '<span class="g">#' + e.guid + '</span>' +
        '<span class="p">' + edEsc(e.prefab || '?') + '</span>' +
        '<span class="c">' + fmt(e.x) + ',' + fmt(e.z) + '</span></div>').join('')
    : '<div class="edMuted" style="padding:8px">没有匹配的对象</div>';
  const c = document.getElementById('edCount');
  if (c) {
    c.textContent = '显示 ' + arr.length + ' / 共 ' + ED.count +
      '（已列出 ' + ED.listed + '）' + (ED.count > ED.listed ? ' ⚠ 已达上限' : '');
  }
}

// ---------------------------------------------------------------- 选中与属性
function edSelect(guid, follow) {
  const e = ED.ents.find((x) => x.guid === guid);
  if (!e) return;
  ED.sel = Object.assign({}, e);
  edRenderList();
  edRenderProps();
  if (follow && e.x != null) { cam.x = e.x; cam.z = e.z; cam.follow = false; }
}
function edRenderProps() {
  const box = document.getElementById('edPropsBody');
  if (!box) return;
  const s = ED.sel;
  if (!s) { box.innerHTML = '<span class="edMuted">未选中对象</span>'; return; }
  const num = (v) => (v == null ? '' : v);
  box.innerHTML =
    '<div class="edField"><label>guid</label><input value="' + s.guid + '" readonly></div>' +
    '<div class="edField"><label>prefab</label><input value="' + edEsc(s.prefab || '?') + '" readonly></div>' +
    '<div class="edField"><label>x</label><input id="edX" value="' + num(s.x) + '"></div>' +
    '<div class="edField"><label>z</label><input id="edZ" value="' + num(s.z) + '"></div>' +
    '<div class="edField"><label>hp</label><input value="' + (s.hp == null ? '—' : s.hp) + '" readonly></div>' +
    '<div class="edBtns"><button id="edApply">应用坐标</button>' +
    '<button id="edGoto">聚焦</button>' +
    '<button id="edKill" class="danger">删除</button></div>';
  document.getElementById('edApply').onclick = () => {
    const x = parseFloat(document.getElementById('edX').value);
    const z = parseFloat(document.getElementById('edZ').value);
    // ★ 明确校验：`parseFloat("")` 是 NaN，`parseFloat("3abc")` 是 3。
    //   不校验的话「空着点应用」会发一个 NaN 出去，服务端拒绝，用户只看到失败。
    if (!isFinite(x) || !isFinite(z)) { edSetStatus('x / z 必须是数字', true); return; }
    edMove(s.guid, x, z);
  };
  document.getElementById('edGoto').onclick = () => {
    if (s.x == null) { edSetStatus('这个对象没有位置', true); return; }
    cam.x = s.x; cam.z = s.z; cam.follow = false;
    edSetStatus('已聚焦 #' + s.guid);
  };
  document.getElementById('edKill').onclick = () => edRemove(s.guid);
}

// ---------------------------------------------------------------- 三个动作
function edMove(guid, x, z) {
  edSetStatus('移动 #' + guid + ' → (' + x + ', ' + z + ') …');
  edJson('/editor/move?guid=' + guid + '&x=' + x + '&z=' + z).then((d) => {
    if (!d.ok) { edSetStatus('移动失败：' + (d.error || '未知'), true); return; }
    if (ED.sel && ED.sel.guid === guid) { ED.sel.x = d.x; ED.sel.z = d.z; edRenderProps(); }
    // ★ 报**回读**的坐标，不报我发出去的那个：SetPosition 不返回值，
    //   挪没挪动只有回读算数。显示期望值会把「挪失败」伪装成「挪成功」。
    edSetStatus('已移动 #' + guid + ' → (' + d.x + ', ' + d.z + ')');
    edRefresh();
  }).catch((e) => edSetStatus('移动出错：' + e.message, true));
}
function edRemove(guid) {
  edJson('/editor/remove?guid=' + guid).then((d) => {
    if (!d.ok) { edSetStatus('删除失败：' + (d.error || '未知'), true); return; }
    if (ED.sel && ED.sel.guid === guid) { ED.sel = null; edRenderProps(); }
    // ★★ C2：**摘掉几个子实体要说出来**。
    //   宿主现在的语义是"删父只摘不删"—— 子实体留在原位、只是不再属于谁。
    //   不告诉用户的话，删一个容器就等于"东西还在，但你再也不知道它们属于哪"，
    //   而界面什么都不说 —— 那就是静默。
    const det = (typeof d.detached === 'number' && d.detached > 0)
      ? ('，摘掉 ' + d.detached + ' 个子实体（留在原位，只是不再属于它）') : '';
    // ★ 顺带修掉第四处"先写状态后刷新"（前三次见 edSetStatusAfterRefresh 的注释）。
    edSetStatusAfterRefresh('已删除 #' + guid + '（' + d.prefab + '）' + det);
  }).catch((e) => edSetStatus('删除出错：' + e.message, true));
}
function edSpawn(prefab, x, z) {
  edSetStatus('生成 ' + prefab + ' @ (' + x + ', ' + z + ') …');
  edJson('/editor/spawn?prefab=' + encodeURIComponent(prefab) + '&x=' + x + '&z=' + z)
    .then((d) => {
      if (!d.ok) { edSetStatus('生成失败：' + (d.error || '未知'), true); return; }
      edSetStatus('已生成 ' + prefab + '  #' + d.guid);
      edRefresh();
    }).catch((e) => edSetStatus('生成出错：' + e.message, true));
}

// ---------------------------------------------------------------- 视口交互
function edScreenToWorld(sx, sy) {
  return { x: cam.x + (sx - cv.width / 2) / cam.zoom,
           z: cam.z - (sy - cv.height / 2) / cam.zoom };
}
function edHitTest(sx, sy) {
  // 命中半径用屏幕像素（30px）而不是世界单位：缩放变化时手感才一致。
  // 取**最近**的那个 —— 叠在一起时（生物的 classified 影子贴着本体）选近的才符合直觉。
  let best = null, bestD = 30;
  for (const e of ED.ents) {
    if (e.x == null || e.z == null) continue;
    const [ex, ey] = w2s(e.x, e.z);
    const d = Math.hypot(ex - sx, ey - sy);
    if (d <= bestD) { best = e; bestD = d; }
  }
  return best;
}
function edClick(sx, sy) {
  if (ED.tool === 'select') {
    const hit = edHitTest(sx, sy);
    if (hit) {
      edSelect(hit.guid, false);
      edSetStatus('选中 #' + hit.guid + ' ' + (hit.prefab || '?'));
    } else {
      ED.sel = null; edRenderProps(); edRenderList();
      edSetStatus('点空了（30px 内没有对象）');
    }
  } else if (ED.tool === 'move') {
    if (!ED.sel) { edSetStatus('先用「选择」点一个对象', true); return; }
    const w = edScreenToWorld(sx, sy);
    edMove(ED.sel.guid, Math.round(w.x * 100) / 100, Math.round(w.z * 100) / 100);
  } else if (ED.tool === 'spawn') {
    const w = edScreenToWorld(sx, sy);
    edSpawn(ED.spawnPrefab, Math.round(w.x * 100) / 100, Math.round(w.z * 100) / 100);
  }
}
function edDrawOverlay() {
  if (!ED.on || !ED.sel) return;
  const s = ED.sel;
  if (s.x == null || s.z == null) return;
  const [sx, sy] = w2s(s.x, s.z);
  // 屏幕外就别画了（否则缩小后会在边缘留一个假框）
  if (sx < -50 || sy < -50 || sx > cv.width + 50 || sy > cv.height + 50) return;
  const r = Math.max(14, cam.zoom * 0.9);
  ctx.save();
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(sx - r, sy - r, r * 2, r * 2);
  ctx.setLineDash([]);
  ctx.fillStyle = '#58a6ff';
  ctx.fillRect(sx - r - 1, sy - r - 1, 12, 2);
  ctx.fillRect(sx - r - 1, sy - r - 1, 2, 12);
  const label = '#' + s.guid + ' ' + (s.prefab || '?');
  ctx.font = '11px ui-monospace,Consolas,monospace';
  const w = ctx.measureText(label).width + 8;
  ctx.fillStyle = 'rgba(13,17,23,.88)';
  ctx.fillRect(sx - r, sy - r - 17, w, 15);
  ctx.fillStyle = '#58a6ff';
  ctx.fillText(label, sx - r + 4, sy - r - 6);
  ctx.restore();
}

// ---------------------------------------------------------------- 开关与绑定
function edToggle(on) {
  const want = (on === undefined) ? !ED.on : !!on;
  if (want === ED.on) return;
  ED.on = want;
  document.getElementById('ed').classList.toggle('on', ED.on);
  document.getElementById('edBtn').classList.toggle('on', ED.on);
  if (ED.on) {
    edSetStatus('正在同步世界…');
    edRefresh();
    // 1.5 s 一次：比帧率慢得多（人眼只需要知道「有没有变」），
    // 又比手速快 —— 刚生成的对象立刻能出现在列表里。
    ED.timer = setInterval(edRefresh, 1500);
  } else if (ED.timer) {
    clearInterval(ED.timer);
    ED.timer = null;
  }
}
// ---------------------------------------------------------------- 场景导出/导入（C4）
// ★ 为什么「存档」与「场景」必须是两个按钮而不是一个：
//   存档 = 接着上次玩（含玩家位置、背包、世界时间）；场景 = 打开一个关卡（只有摆了什么）。
//   合成一个按钮的话，用户按"保存"之后不确定自己存下了什么 —— 而这正是最难自查的错误
//   （两个功能都"看起来成功了"）。
//
// ★ 导入前**先清空**：否则"导入场景"会变成"在原世界上再叠一层"，
//   第二次导入同一份场景会得到双份实体。清空与导入是两个请求，中间失败会留下空世界 ——
//   这是已知的原子性缺口，写在 tooltip 里而不是藏起来。
function sceneBox(on) {
  const box = document.getElementById('edSceneBox');
  if (!box) return;
  if (on === undefined) box.classList.toggle('on');
  else box.classList.toggle('on', !!on);
}

function sceneExport() {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  edJson('/editor/scene_export').then((d) => {
    if (!d || !d.ok) { edSetStatus('导出失败：' + ((d && d.error) || '未知'), true); return; }
    const ta = document.getElementById('edSceneText');
    if (ta) ta.value = d.text || '';
    sceneBox(true);
    edSetStatus('已导出 ' + d.n + ' 个实体（v' + d.version + '，' + (d.text || '').length + ' 字节）');
    if (typeof AudioEngine !== 'undefined') AudioEngine.play('ui.click');
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}

function sceneImport() {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  const ta = document.getElementById('edSceneText');
  const text = ta ? ta.value : '';
  if (!text) { edSetStatus('文本框是空的 —— 先按「场景↓」导出，或粘贴场景文本', true); return; }
  edSetStatus('导入中…');
  // ★★ C3b：**只发一个请求**。清空由服务端在导入内部完成（原子），
  //   客户端不再先发 clear —— 两步之间失败会留下一个空世界，
  //   而"清空 + 导入"本来就是一次不可分割的编辑（也因此只占一步撤销）。
  // ★ C3c：走 POST + JSON body（不再把整份文本塞进 URL）。
  edJson('/editor/scene_import', { body: { text: text } }).then((d) => {
    if (!d || !d.ok) {
      // ★ 失败原因原样显示（它会指出是第几行坏的），不在客户端翻译
      edSetStatusAfterRefresh('✘ 导入失败：' + ((d && d.error) || '未知'), true);
      return;
    }
    edSetStatusAfterRefresh('已导入 ' + d.made + ' 个实体（一步可撤销）');
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}

function sceneClear() {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  // 清空是不可逆的（撤销栈只覆盖 move）—— 必须问一句。
  // ⚠️ 用 typeof 检查而不是直接 confirm()：桩环境里没有 confirm，
  //    直接调会 ReferenceError，而报错会出现在"清空"这条路上。
  if (typeof confirm === 'function' && !confirm('清空世界里所有非玩家实体？这个操作不能撤销。')) return;
  edJson('/editor/scene_clear').then((d) => {
    if (!d || !d.ok) { edSetStatus('清空失败：' + ((d && d.error) || '未知'), true); return; }
    edSetStatusAfterRefresh('已清空 ' + d.removed + ' 个实体');
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}

// ★ C3：场景落盘。名字由**服务端**校验（白名单，不许点与斜杠）——
//   客户端只做"看起来像名字"的提示，绝不做唯一校验：客户端的校验只能防手误，防不了越界。
function sceneName() {
  const el = document.getElementById('edSceneName');
  return el ? String(el.value || '').trim() : '';
}

function sceneSaveFile() {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  const name = sceneName();
  if (!name) { edSetStatus('先填场景名（存到 scenes/<名字>.scene.tsv）', true); return; }
  edJson('/editor/scene_save?name=' + encodeURIComponent(name)).then((d) => {
    if (!d || !d.ok) { edSetStatus('✘ 存盘失败：' + ((d && d.error) || '未知'), true); return; }
    // ★ 回显**盘上真实的字节数**（服务端回读的），不是"我以为写了多少"
    edSetStatus('已存盘 ' + d.name + '（' + d.n + ' 个实体 / ' + d.bytes + ' 字节）');
    if (typeof AudioEngine !== 'undefined') AudioEngine.play('ui.click');
    sceneListRefresh();
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}

function sceneLoadFile() {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  const name = sceneName();
  if (!name) { edSetStatus('先填要读取的场景名', true); return; }
  edJson('/editor/scene_load?name=' + encodeURIComponent(name)).then((d) => {
    if (!d || !d.ok) {
      // ★ 失败时世界**可能已经被清空**了 —— 把 removed 说出来，不要让用户自己发现
      const rm = (d && d.removed !== undefined && d.removed !== null) ? ('，已清空 ' + d.removed + ' 个实体') : '';
      edSetStatusAfterRefresh('✘ 读取失败' + rm + '：' + ((d && d.error) || '未知'), true);
      return;
    }
    edSetStatusAfterRefresh('已读取 ' + d.name + '（导入 ' + d.made + ' 个，清掉 ' + d.removed + ' 个）');
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}

function sceneListRefresh() {
  const box = document.getElementById('edSceneList');
  edJson('/editor/scene_list').then((d) => {
    if (!box) return;
    if (!d || !d.ok) { box.textContent = '（列表失败）'; return; }
    box.textContent = d.n ? ('已有：' + d.names.join(' · ')) : '（还没有存过场景）';
  }).catch(() => { if (box) box.textContent = '（列表失败）'; });
}

(function wireScene() {
  const b1 = document.getElementById('edSceneOut');
  const b2 = document.getElementById('edSceneIn');
  const b3 = document.getElementById('edSceneClear');
  if (b1) b1.onclick = sceneExport;
  if (b2) b2.onclick = sceneImport;
  if (b3) b3.onclick = sceneClear;
  const s1 = document.getElementById('edSceneSave');

  if (s1) s1.onclick = sceneSaveFile;
  if (s2) s2.onclick = sceneLoadFile;
  window.__rt = window.__rt || {};
  // ★ C2：把删除与刷新也挂出来 —— 判据要能**直接驱动删除**，
  //   否则只能靠"先选中再点工具栏"去模拟，而那条路依赖选择状态，脆弱且难读。
  window.__rt.ed = { remove: edRemove, refresh: edRefresh,
                     status: () => { const el = document.getElementById('edStatus'); return el ? el.textContent : ''; } };
  window.__rt.scene = { export: sceneExport, import: sceneImport, clear: sceneClear,
                        save: sceneSaveFile, load: sceneLoadFile, list: sceneListRefresh,
                        box: sceneBox,
                        text: () => { const t = document.getElementById('edSceneText'); return t ? t.value : ''; } };
})();

// ---------------------------------------------------------------- 撤销/重做（M1-1）
// ★ 为什么按钮上不显示"还能撤几步"：那需要一个额外的计数接口，而**状态栏一句话**
//   已经足够（"已撤销 移动#23"）。信息密度不是越高越好 —— 工具栏上每多一个数字，
//   用户就多一处要理解的东西。
function edUndoRedo(which) {
  if (!ED.on) { edSetStatus('先按 F1 打开编辑器', true); return; }
  edJson('/editor/' + which).then((d) => {
    if (d && d.ok) {
      // ★ 服务端返回的是**事实**（kind/target/落到哪个坐标），直接回显它，
      //   不在客户端自己拼一句"撤销成功"—— 那样两边的话术迟早分叉。
      const to = d.to ? (' → (' + d.to.x + ',' + d.to.z + ')') : '';
      // ★ M1-1b：**生成/删除**的 target 是"占位号"（生成时还没有 guid，用负数占位；
      //   删除重建后会换号）⇒ 把 target 印出来只会让人困惑（"ent#-1"）。
      //   所以负数 target 不显示，改成显示**人类可读的 label**（`生成 evergreen` / `删除`）。
      //   kind 仍然保留在括号里：出问题时要能一眼看出是哪类命令。
      const tgt = (typeof d.target === 'number' && d.target >= 0) ? ('#' + d.target) : '';
      const lbl = d.label ? ('（' + d.label + '）') : '';
      edSetStatusAfterRefresh((which === 'undo' ? '已撤销 ' : '已重做 ') + d.kind + tgt + to + lbl);
      if (typeof AudioEngine !== 'undefined') AudioEngine.play(which === 'undo' ? 'ui.click' : 'ui.click');
    } else {
      // 栈空不是错误，是"没什么可做的"—— 但它也不该显示成成功
      edSetStatus((which === 'undo' ? '撤销' : '重做') + '：' + ((d && d.error) || '未知'), true);
    }
  }).catch((e) => edSetStatus('请求失败：' + e, true));
}
document.getElementById('edUndo').onclick = () => edUndoRedo('undo');
document.getElementById('edRedo').onclick = () => edUndoRedo('redo');
addEventListener('keydown', (e) => {
  // Ctrl+Z / Ctrl+Shift+Z。只在编辑器打开时接管 —— 否则会抢浏览器的默认撤销，
  // 而用户在输入框里打字时，那个默认行为是他要的。
  if (!ED.on) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    edUndoRedo(e.shiftKey ? 'redo' : 'undo');
  }
});

document.getElementById('edBtn').onclick = () => edToggle();
document.getElementById('edHideAnon').checked = ED.hideAnon;
document.getElementById('edHideAnon').onchange = (e) => {
  ED.hideAnon = e.target.checked;
  edRenderList();
};
document.getElementById('edSearch').oninput = (e) => {

};
document.getElementById('edPrefab').onchange = (e) => {
  ED.spawnPrefab = e.target.value;
  edSetStatus('「生成」将放置：' + ED.spawnPrefab);
};
document.querySelectorAll('#edBar [data-tool]').forEach((b) => {
  b.onclick = () => {
    ED.tool = b.dataset.tool;
    document.querySelectorAll('#edBar [data-tool]')
      .forEach((x) => x.classList.toggle('on', x === b));

                  spawn: '点地图生成 ' + ED.spawnPrefab }[ED.tool];

  };
});
document.getElementById('edList').addEventListener('click', (e) => {
  const row = e.target.closest ? e.target.closest('.edRow') : null;
  if (!row) return;
  edSelect(parseInt(row.dataset.g, 10), true);   // 点列表项顺便把相机移过去

document.getElementById('edSave').onclick = () => {

  fetch('/save').then((r) => r.json()).then((d) => {

document.getElementById('edFocus').onclick = () => {

document.getElementById('edDel').onclick = () => {

// ---------------------------------------------------------------- 合成面板（B2）
// ★ 为什么它是**独立面板**而不是并进编辑器：
//   合成是玩法（玩家不打开编辑器也要能造东西），编辑器是工具。混在一起会让
//   「这个按钮是玩还是编」变得不可判 —— 而本工程的编辑器面板本来就只放编辑行为。
//
// ★ 为什么"不能造的配方"也留在列表里（置灰而不是隐藏）：
//   藏起来的话面板上永远只有能造的东西，玩家就看不到"再攒 2 个木头就能造营火"
//   这个进度感。置灰 + 点击时说出缺什么，才是可操作的信息。
//
// ★ 为什么只拉 60 条：原版有效配方 900+ 条，全渲染会拖慢第一次打开。
//   服务端已经**先排可造的**，所以前 60 条里优先是现在能做的事。
const CR = { on: false, busy: false, items: [], timer: null, limit: 60 };

function crMsg(text, kind) {
  const el = document.getElementById('craftMsg');
  if (!el) return;
  el.textContent = text;
  el.className = kind || '';
}

function crRenderList() {
  const box = document.getElementById('craftList');
  if (!box) return;
  box.innerHTML = '';
  for (let i = 0; i < CR.items.length; i++) {
    const it = CR.items[i];
    const row = document.createElement('div');
    row.className = 'crRow ' + (it.can ? 'yes' : 'no');
    const p = document.createElement('span');
    p.className = 'p';
    p.textContent = it.product || it.name;
    const g = document.createElement('span');
    g.className = 'i';
    g.textContent = it.ingredients || '（无材料）';
    row.appendChild(p);
    row.appendChild(g);
    row.title = it.can ? ('点击合成 ' + it.name) : ('需要 ' + (it.ingredients || '?'));
    row.onclick = () => crClick(it);
    box.appendChild(row);
  }
}

function crClick(it) {
  // 置灰的配方**不发请求**：先不说省一次往返，更重要的是「不能造」这件事
  // 客户端已经知道了（服务端把它标成 can=false），再问一次只会得到同一句话。
  if (!it.can) {
    crMsg('✘ 材料不足：' + it.name + ' 需要 ' + (it.ingredients || '?') +
          '（背包里没有凑齐）', 'bad');
    return;
  }
  crMsg('合成中：' + it.name + ' …');
  edJson('/editor/craft?slot=0&recipe=' + encodeURIComponent(it.name)).then((d) => {
    if (d && d.ok) {
      crMsg('✔ 造出 ' + it.name + '（世界实体 ' + d.ents_before + ' → ' + d.ents_after + '）', 'good');
      // ★ H1：合成成功给一声。音频"有没有反应"比"好不好听"重要得多 ——
      //   一个没有反馈的操作，用户会怀疑自己到底点到了没有。
      if (typeof AudioEngine !== 'undefined') AudioEngine.play('craft.ok');
      crRefresh();
    } else {
      // ★ 服务端的失败原因要**原样显示**，不要在这里翻译成"合成失败"：
      //   它会区分"材料不足（缺什么）"和"配方不存在"，这两件事玩家要做的事不同。
      crMsg('✘ ' + ((d && d.error) || '未知错误'), 'bad');
    }
  }).catch((e) => crMsg('✘ 请求失败：' + e, 'bad'));
}

function crRefresh() {
  if (CR.busy) return;
  CR.busy = true;
  edJson('/editor/recipes?slot=0&limit=' + CR.limit).then((d) => {
    CR.busy = false;
    if (!d || !d.ok) { crMsg('读取失败：' + ((d && d.error) || '未知'), 'bad'); return; }
    CR.items = d.items || [];
    crRenderList();
    const stat = document.getElementById('craftStat');
    if (stat) stat.textContent = '可造 ' + d.craftable + '/' + d.valid +
                                 ' · ' + (d.ms || 0) + 'ms';
    if (!CR.items.length) crMsg('没有可显示的配方（材料不够，或配方表没加载）', 'bad');
  }).catch((e) => { CR.busy = false; crMsg('✘ 请求失败：' + e, 'bad'); });
}

function crToggle(on) {
  const want = (on === undefined) ? !CR.on : !!on;
  if (want === CR.on) return;
  CR.on = want;
  const panel = document.getElementById('craft');
  const btn = document.getElementById('craftBtn');
  if (panel) panel.classList.toggle('on', CR.on);
  if (btn) btn.classList.toggle('on', CR.on);
  if (CR.on) {
    // 打开时刷一次；关闭时停掉 —— 这个接口要遍历 900+ 配方并逐个查背包，
    // **绝不能像编辑器那样 1.5 s 轮询一次**（实测 4 ms/次，看着不多，
    // 但那是模拟线程里跑的，挂进轮询就等于每 1.5 s 抽走模拟线程一次）。
    crRefresh();
    CR.timer = setInterval(crRefresh, 8000);
  } else if (CR.timer) {
    clearInterval(CR.timer);
    CR.timer = null;
  }
}

(function wireCraft() {
  const btn = document.getElementById('craftBtn');
  if (btn) btn.onclick = () => crToggle();
  const close = document.getElementById('craftClose');
  if (close) close.onclick = () => crToggle(false);
  addEventListener('keydown', (e) => {
    // ★ F2 而不是 C：C 在饥荒里是「检查」，把它劫持成开合成面板会让
    //   动作键在玩家不知情的时候改变含义。F1 已被编辑器占，F2 顺位。
    if (e.key === 'F2') { e.preventDefault(); crToggle(); }
  });
  // 测试钩子：与 __rt.key 同一个思路 —— 让判据能直接驱动面板，不必模拟鼠标
  window.__rt = window.__rt || {};
  window.__rt.craft = { toggle: crToggle, refresh: crRefresh, click: crClick,
                        state: () => ({ on: CR.on, n: CR.items.length }) };
})();

addEventListener('keydown', (e) => {
  // ★ F1 而不是 Tab：Tab 是浏览器/读屏器的焦点键，劫持它会让键盘导航失效。
  if (e.key === 'F1') { e.preventDefault(); edToggle(); }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
